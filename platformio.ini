[platformio]
default_envs = esp01_1m

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200

# SPIFFS / LittleFS configuration
board_build.ldscript = eagle.flash.1m128.ld  ; 1MB flash, 128KB FS (or 64KB, but 128KB gives plenty room for FS or OTA if needed)

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1

build_flags =
    -D BUTTON_PIN=1
    -D LED_PIN=3
    -D SDA_PIN=0
    -D SCL_PIN=2
